name: Release

# Tag the commit and the release builds itself:
#
#     git tag -a v2.0 -m "nmap-vulners 2.0" && git push origin v2.0
#
# The gates run first: a release that cannot pass its own tests is not a
# release. The archives are built with git archive, so they contain exactly
# what a user downloads - the scripts and their data, without tests or CI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install nmap
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap

      - name: Repository hygiene
        run: python3 tools/check.py

      - name: Unit tests
        env:
          VULNERS_API_KEY: not-a-real-key-the-suite-must-ignore-this
        run: |
          set -o pipefail
          nmap -sn -Pn --script ./tests/run.nse \
            --script-args testdir=tests,root=. 127.0.0.1 | tee unit.log
          grep -q "SUITE OK" unit.log

      - name: End-to-end tests
        run: python3 tests/e2e/run_e2e.py

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Name the release
        id: name
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prefix=nmap-vulners-${TAG#v}" >> "$GITHUB_OUTPUT"

      # The tag names the release; each script carries its own api_version,
      # which identifies the request generation to vulners.com and moves on its
      # own schedule. Both are printed so the release notes can be checked
      # against what actually shipped.
      - name: Report the versions being released
        run: |
          case "${{ steps.name.outputs.tag }}" in
            v[0-9]*.[0-9]*) : ;;
            *) echo "tag should look like v1.5"; exit 1 ;;
          esac
          grep -H "^local api_version" vulners.nse vulners_enterprise.nse

      # git archive honours export-ignore, so tests, CI and docs stay out.
      - name: Build the archives
        run: |
          mkdir -p dist
          PREFIX="${{ steps.name.outputs.prefix }}"
          git archive --format=tar.gz --prefix="$PREFIX/" \
            -o "dist/$PREFIX.tar.gz" "${{ steps.name.outputs.tag }}"
          git archive --format=zip --prefix="$PREFIX/" \
            -o "dist/$PREFIX.zip" "${{ steps.name.outputs.tag }}"
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Show what users will download
        run: tar -tzf "dist/${{ steps.name.outputs.prefix }}.tar.gz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.name.outputs.tag }}"
          gh release create "$TAG" dist/* \
            --title "nmap-vulners ${TAG#v}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo '')" \
            --verify-tag
